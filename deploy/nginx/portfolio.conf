# /etc/nginx/sites-available/portfolio  (symlink into sites-enabled)
# Expects deploy/nginx/http-context.conf and the generated
# /etc/nginx/conf.d/cloudflare-realip.conf to be installed too.

upstream portfolio_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name salimelhani.tn www.salimelhani.tn;
    return 301 https://salimelhani.tn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name salimelhani.tn;

    # Cloudflare Origin Certificate (SSL/TLS mode "Full (strict)").
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    # Authenticated Origin Pulls: only Cloudflare holds a client certificate
    # this CA signed, so requests that skip Cloudflare are refused.
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    # The only POST is the contact form, a few KB at most.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # public/ files (the CV, case-study images) straight from disk.
    root /var/www/portfolio/current/public;

    location = /api/contact {
        client_max_body_size 16k;
        limit_req zone=contact burst=5 nodelay;
        proxy_pass http://portfolio_app;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }

    # Hashed build output: safe to cache forever.
    location /_next/static/ {
        alias /var/www/portfolio/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # A file in public/ if one matches, otherwise the app. Public filenames
    # aren't hashed, so they get a week rather than forever.
    location / {
        try_files $uri @app;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location @app {
        proxy_pass http://portfolio_app;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
}
