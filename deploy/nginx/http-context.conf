# /etc/nginx/conf.d/portfolio-http.conf  (http-level settings)

# 10 contact-form posts a minute per visitor, before they reach Node. The
# app's own limit (5 an hour) is the real cap; this sheds floods cheaply.
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;
limit_req_status 429;

server_tokens off;
