# Checks every push and pull request: types, lint, tests, and a production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # same as the production server
          cache: npm
      - run: npm ci
      # Generates the route types (LayoutProps, PageProps) that tsc needs on a fresh checkout.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A production build needs SITE_URL; any address works for checking the build.
      - run: npm run build
        env:
          SITE_URL: https://example.com
      # Runs the build the way PM2 does in production (deploy/), and checks it
      # answers, serves public/ files, and sends its security headers.
      - name: Smoke-test the standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cd .next/standalone
          HOSTNAME=127.0.0.1 PORT=3000 SITE_URL=https://example.com node server.js &
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/Salim_Elhani_CV.pdf
          headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:3000/)
          grep -qi '^content-security-policy:' <<< "$headers" || { echo "Security headers missing"; exit 1; }
          if grep -qi '^x-powered-by:' <<< "$headers"; then echo "X-Powered-By is exposed"; exit 1; fi
