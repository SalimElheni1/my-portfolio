# Checks every push and pull request: types, lint, tests, and a production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # same as the Dockerfile
          cache: npm
      - run: npm ci
      # Generates the route types (LayoutProps, PageProps) that tsc needs on a fresh checkout.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A production build needs SITE_URL; any address works for checking the build.
      - run: npm run build
        env:
          SITE_URL: https://example.com
      # The production image builds separately, with SITE_URL passed in as a build argument.
      - run: docker build --target runner --build-arg SITE_URL=https://example.com .
